{% set name = "smartypants" %}
{% set version = "2.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/leohemsted/{{ name }}.py/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 560ae7485a27c288f5bd63131f5c3c7b8f0745f50e7c3f85f0bbc65d87799d19

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - smartypants

about:
  home: https://github.com/justinmayer/smartypants.py
  license_file: COPYING
  license: BSD-3-Clause
  license_family: BSD
  summary: Python with the SmartyPants
  dev_url: https://github.com/leohemsted/smartypants.py
  doc_url: https://smartypants.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - thewchan
